name: Build & Deploy (GHCR to Coolify)

# Setiap push ke main: build image di GitHub (bukan di VPS), uji image, push ke GHCR, lalu minta Coolify
# di VPS menarik image itu dan me-restart aplikasi. Tujuan deploy diatur di Settings repo, bukan di file ini:
#   Variables: COOLIFY_URL (mis. http://187.52.115.253:8000), COOLIFY_APP_UUID, APP_URL (alamat publik aplikasi)
#   Secrets:   COOLIFY_API_TOKEN (Coolify > Keys & Tokens, izin "deploy")
# Selama belum diisi, langkah deploy dilewati dan workflow tetap lulus (image tetap terbit di GHCR).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production-${{ github.repository }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build, push, deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # GHCR wajib huruf kecil; tiap repo memakai paket miliknya sendiri (izin GITHUB_TOKEN terbatas pada repo ini).
      - name: Resolve image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build image for smoke test (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          push: false
          tags: app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image
        run: |
          set -euo pipefail
          docker run -d --name smoke -p 3000:3000 \
            -e AUTH_SECRET=ci-smoke-secret-ci-smoke-secret-ci-smoke-secret \
            app:ci
          CODE=000
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/login || true)
            echo "login -> HTTP $CODE"
            [ "$CODE" = "200" ] && break
            sleep 2
          done
          [ "$CODE" = "200" ] || { docker logs smoke; exit 1; }
          # Halaman terproteksi harus mengarahkan ke /login tanpa sesi.
          REDIR=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/)
          echo "/ -> HTTP $REDIR"
          [ "$REDIR" = "307" ] || { docker logs smoke; exit 1; }
          docker rm -f smoke

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Coolify deploy (pull & restart on VPS)
        id: deploy
        env:
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_APP_UUID: ${{ vars.COOLIFY_APP_UUID }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          if [ -z "$COOLIFY_URL" ] || [ -z "$COOLIFY_APP_UUID" ] || [ -z "$COOLIFY_TOKEN" ]; then
            echo "::notice::Deploy dilewati: isi variabel COOLIFY_URL, COOLIFY_APP_UUID dan secret COOLIFY_API_TOKEN di Settings repo."
            echo "triggered=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          curl --fail --show-error --silent --location \
            --request POST "${COOLIFY_URL%/}/api/v1/deploy?uuid=${COOLIFY_APP_UUID}&force=false" \
            --header "Authorization: Bearer $COOLIFY_TOKEN"
          echo
          echo "Coolify deployment dipicu."
          echo "triggered=true" >> "$GITHUB_OUTPUT"

      - name: Verify live service health
        if: steps.deploy.outputs.triggered == 'true' && vars.APP_URL != ''
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          echo "Menunggu Coolify menarik image dan me-restart container..."
          sleep 40
          for i in $(seq 1 24); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "${APP_URL%/}/login" || true)
            echo "Percobaan $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Aplikasi LIVE dan sehat."
              exit 0
            fi
            sleep 10
          done
          echo "Aplikasi belum sehat dalam batas waktu."
          exit 1
